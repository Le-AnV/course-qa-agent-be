services:
  postgres:
    image: postgres:16-alpine
    container_name: course-qa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: qa
      POSTGRES_PASSWORD: qa
      POSTGRES_DB: course_qa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa -d course_qa"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: course-qa-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  backend:
    build: .
    container_name: course-qa-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://qa:qa@postgres:5432/course_qa
      QDRANT_URL: http://qdrant:6333
      DOCUMENT_STORAGE_DIR: /app/storage/documents
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:3100","http://127.0.0.1:3000","http://127.0.0.1:3100"]'
    volumes:
      - document_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: course-qa-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

# Volume names pinned to the monorepo ones so existing data is kept
# (course-qa-agent_postgres_data / course-qa-agent_qdrant_storage).
volumes:
  postgres_data:
    name: course-qa-agent_postgres_data
  qdrant_storage:
    name: course-qa-agent_qdrant_storage
  pgadmin_data:
    name: course-qa-agent_pgadmin_data
  document_storage:
    name: course-qa-agent_document_storage
