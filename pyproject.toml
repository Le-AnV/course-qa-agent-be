[project]
name = "course-qa-agent-backend"
version = "0.1.0"
description = "Course QA Agent backend — FastAPI modular monolith (AI-112 skeleton)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.142.2",
  "uvicorn[standard]>=0.34",
  "pydantic-settings>=2.0",
  "SQLAlchemy>=2.0",
  "psycopg[binary]>=3.1",
  "bcrypt>=4.1",
  "pyjwt>=2.15.1",
  "openpyxl>=3.1",
  "email-validator>=2.0",
  "google-genai>=1,<3",
  "langchain-core>=1.0",
  "langchain-text-splitters>=1.0",
  "langchain-google-genai>=4.0",
  "pypdfium2>=5.0",
  "python-docx>=1.0",
  "Pillow>=10.0",
  "langchain-qdrant>=1.1.0",
  "qdrant-client>=1.19.1",
  "python-multipart>=0.0.32",
  "alembic>=1.14",
  "markitdown[docx,pdf]>=0.1.8",
  "pymupdf4llm>=1.28.2",
  "python-pptx>=1.0.2",
  "torch>=2.0",
  "transformers>=4.40",
  "pymupdf>=1.28.2",
  "httpx>=0.28",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.8",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# B008 (function call in argument defaults) is FastAPI's documented Depends pattern.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
