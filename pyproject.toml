[project]
name = "course-qa-agent-backend"
version = "0.1.0"
description = "Course QA Agent backend — FastAPI modular monolith (AI-112 skeleton)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.142.2",
  "uvicorn[standard]>=0.34",
  "pydantic-settings>=2.0",
  "SQLAlchemy>=2.0",
  "psycopg[binary]>=3.1",
  "bcrypt>=4.1",
  "PyJWT>=2.8",
  "openpyxl>=3.1",
  "email-validator>=2.0",
  "python-multipart>=0.0.18",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx>=0.28",
  "ruff>=0.8",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# B008 (function call in argument defaults) is FastAPI's documented Depends pattern.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
